<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Power BI - Análise Detalhada</title>
    <!-- Fonte limpa, estilo dashboard analítico -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0d0d0d;
            --text-main: #e5e5e5;
            --text-muted: #888888;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
            max-width: 800px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 500;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: #e5e5e5;
        }

        .preview-wrapper {
            position: relative;
            padding: 10px;
            background: #000000;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .preview-canvas {
            display: block;
            width: 100%;
            max-width: 1280px;
            height: auto;
        }
    </style>
</head>

<body>

    <div class="header-section">
        <h1>Dashboard P2: Análise Detalhada</h1>
        <p class="tagline">Layout focado em distribuição estatística e explicabilidade do modelo (SHAP).</p>
    </div>

    <div class="controls">
        <button class="btn" onclick="downloadSVG()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Exportar SVG (Página 2)
        </button>
    </div>

    <div class="preview-wrapper">
        <svg id="pbi-template-p2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
            <!-- Efeito de Sombra para dar profundidade aos cartões -->
            <defs>
                <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
                    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
                </filter>
            </defs>

            <!-- Background do Canvas Principal -->
            <rect width="1280" height="720" fill="#1C1C1C" />

            <!-- Barra Lateral Esquerda (Sidebar: Largura 210) -->
            <rect x="0" y="0" width="210" height="720" fill="#121212" />

            <!-- Header da Barra Lateral (Ícone de Escudo de Risco) -->
            <g transform="translate(15, 25)">
                <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z" fill="#A278E1" />
                <path d="M12 7v10M8 12h8" stroke="#121212" stroke-width="2" stroke-linecap="round" />
            </g>
            <text x="50" y="42" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#e5e5e5">Risco
                Preditivo</text>
            <line x1="15" y1="70" x2="195" y2="70" stroke="#2a2a2a" stroke-width="1" />

            <!-- Ficha Técnica do Modelo (Substituindo os filtros vazios) -->
            <text x="15" y="110" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#A278E1"
                text-transform="uppercase" letter-spacing="1">Especificações do Modelo</text>
            
            <text x="15" y="145" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#666666"
                text-transform="uppercase" letter-spacing="1">Algoritmo Campeão</text>
            <text x="15" y="165" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#e5e5e5">LightGBM Classifier</text>

            <text x="15" y="215" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#666666"
                text-transform="uppercase" letter-spacing="1">Variável Alvo (Target)</text>
            <text x="15" y="235" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#e5e5e5">Inadimplência Real</text>

            <text x="15" y="285" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#666666"
                text-transform="uppercase" letter-spacing="1">Amostra de Teste</text>
            <text x="15" y="305" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#e5e5e5">6.515 Clientes</text>
            
            <text x="15" y="355" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#666666"
                text-transform="uppercase" letter-spacing="1">Performance (ROC-AUC)</text>
            <text x="15" y="375" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#e5e5e5">94.6%</text>

            <!-- Top Header Area (Altura: 60) -->
            <rect x="210" y="0" width="1070" height="60" fill="#121212" />

            <!-- Título Estilizado -->
            <g filter="url(#shadow)">
                <text x="230" y="38" font-family="Inter, sans-serif" font-size="22" font-weight="600">
                    <tspan fill="#e5e5e5">Performance do </tspan>
                    <tspan fill="#A278E1">Modelo</tspan>
                </text>
                <!-- Linha de detalhe abaixo do título -->
                <rect x="230" y="48" width="40" height="3" rx="1.5" fill="#A278E1" />
            </g>

            <!-- ==============================
                 KPIs (Cards) - Y: 70, H: 90
                 ============================== -->

            <!-- KPI 1: ROC AUC -->
            <rect x="220" y="70" width="255" height="90" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"
                filter="url(#shadow)" />
            <rect x="220" y="70" width="3" height="90" rx="1.5" fill="#A278E1" />
            <path d="M 220 78 A 8 8 0 0 1 228 70 L 250 70 L 250 160 L 228 160 A 8 8 0 0 1 220 152 Z" fill="#A278E1"
                opacity="0.04" />
            <text x="235" y="95" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#666666"
                letter-spacing="0.5">ROC-AUC (DISTINÇÃO)</text>
            <g transform="translate(435, 80)" stroke="#444444" fill="none" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M16 12l-4-4-4 4"></path>
                <path d="M12 16V8"></path>
            </g>

            <!-- KPI 2: Recall do Modelo -->
            <rect x="485" y="70" width="255" height="90" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"
                filter="url(#shadow)" />
            <rect x="485" y="70" width="3" height="90" rx="1.5" fill="#A278E1" />
            <path d="M 485 78 A 8 8 0 0 1 493 70 L 515 70 L 515 160 L 493 160 A 8 8 0 0 1 485 152 Z" fill="#A278E1"
                opacity="0.04" />
            <text x="500" y="95" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#666666"
                letter-spacing="0.5">RECALL (TAXA DE DETECÇÃO)</text>
            <g transform="translate(700, 80)" stroke="#444444" fill="none" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </g>

            <!-- KPI 3: Precisão Geral -->
            <rect x="750" y="70" width="255" height="90" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"
                filter="url(#shadow)" />
            <rect x="750" y="70" width="3" height="90" rx="1.5" fill="#A278E1" />
            <path d="M 750 78 A 8 8 0 0 1 758 70 L 780 70 L 780 160 L 758 160 A 8 8 0 0 1 750 152 Z" fill="#A278E1"
                opacity="0.04" />
            <text x="765" y="95" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#666666"
                letter-spacing="0.5">PRECISÃO (CONFIANÇA)</text>
            <g transform="translate(965, 80)" stroke="#444444" fill="none" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="6"></circle>
                <circle cx="12" cy="12" r="2"></circle>
            </g>

            <!-- KPI 4: F1-Score -->
            <rect x="1015" y="70" width="255" height="90" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"
                filter="url(#shadow)" />
            <rect x="1015" y="70" width="3" height="90" rx="1.5" fill="#A278E1" />
            <path d="M 1015 78 A 8 8 0 0 1 1023 70 L 1045 70 L 1045 160 L 1023 160 A 8 8 0 0 1 1015 152 Z"
                fill="#A278E1" opacity="0.04" />
            <text x="1030" y="95" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#666666"
                letter-spacing="0.5">F1-SCORE (EQUILÍBRIO)</text>
            <g transform="translate(1230, 80)" stroke="#444444" fill="none" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </g>

            <!-- ==============================
                 LAYOUT DE GRÁFICOS P2 (2 Gráficos Lado a Lado)
                 ============================== -->

            <!-- 1. Distribuição de Probabilidade (Esquerda) -->
            <!-- x: 220, y: 170, w: 520, h: 540 -->
            <rect x="220" y="170" width="520" height="540" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"
                filter="url(#shadow)" />

            <!-- 2. Importância de Variáveis - SHAP (Direita Topo) -->
            <!-- x: 750, y: 170, w: 520, h: 265 -->
            <rect x="750" y="170" width="520" height="265" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"
                filter="url(#shadow)" />

            <!-- 3. Comparativo de Modelos (Direita Base) -->
            <!-- x: 750, y: 445, w: 520, h: 265 -->
            <rect x="750" y="445" width="520" height="265" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"
                filter="url(#shadow)" />
        </svg>
    </div>

    <script>
        function downloadSVG() {
            const svgElement = document.getElementById('pbi-template-p2');
            const serializer = new XMLSerializer();
            let svgString = serializer.serializeToString(svgElement);

            if (!svgString.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
                svgString = svgString.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }

            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Template_Matte_Analise_P2.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>

</html>
