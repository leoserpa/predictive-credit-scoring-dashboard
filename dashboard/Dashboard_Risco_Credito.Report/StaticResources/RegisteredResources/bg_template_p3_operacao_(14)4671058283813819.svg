<?xml version="1.0" standalone="no"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" id="pbi-template-p3" xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
            <defs>
                <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
                    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
                </filter>
            </defs>

            <!-- Background do Canvas Principal -->
            <rect width="1280" height="720" fill="#1C1C1C"/>

            <!-- Barra Lateral Esquerda (Sidebar: Largura 210) -->
            <rect x="0" y="0" width="210" height="720" fill="#121212"/>

            <!-- Header da Barra Lateral (Ícone de Escudo de Risco) -->
            <g transform="translate(15, 25)">
                <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z" fill="#A278E1"/>
                <path d="M12 7v10M8 12h8" stroke="#121212" stroke-width="2" stroke-linecap="round"/>
            </g>
            <text x="50" y="42" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#e5e5e5">Risco
                Preditivo</text>
            <line x1="15" y1="70" x2="195" y2="70" stroke="#2a2a2a" stroke-width="1"/>

            <!-- Guias para os Segmentadores (Filtros Reais da Mesa) -->
            <text x="15" y="120" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#666666" text-transform="uppercase" letter-spacing="1">Categoria de Risco</text>

            <text x="15" y="200" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#666666" text-transform="uppercase" letter-spacing="1">Histórico de Inadimplência</text>

            <text x="15" y="280" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#666666" text-transform="uppercase" letter-spacing="1">Motivo do Empréstimo</text>

            <text x="15" y="360" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#666666" text-transform="uppercase" letter-spacing="1">Tipo de Moradia</text>

            <line x1="15" y1="410" x2="195" y2="410" stroke="#2a2a2a" stroke-width="1"/>

            <!-- LEGENDA DE RISCO -->
            <text x="15" y="440" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#A278E1" text-transform="uppercase" letter-spacing="1">Legenda de Risco</text>

            <g transform="translate(15, 460)">
                <!-- Muito Baixo -->
                <circle cx="6" cy="5" r="5" fill="#404040"/>
                <text x="18" y="9" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#404040">Muito
                    Baixo (&lt; 20%)</text>

                        <!-- Baixo -->
                        <circle cx="6" cy="30" r="5" fill="#5E5E5E"/>
                        <text x="18" y="34" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5E5E5E">Baixo (20% - 40%)</text>

                        <!-- Moderado -->
                        <circle cx="6" cy="55" r="5" fill="#73648A"/>
                        <text x="18" y="59" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#73648A">Moderado (40% - 60%)</text>

                        <!-- Alto -->
                        <circle cx="6" cy="80" r="5" fill="#8367B8"/>
                        <text x="18" y="84" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#8367B8">Alto (60% - 80%)</text>

                        <!-- Muito Alto -->
                        <circle cx="6" cy="105" r="5" fill="#A278E1"/>
                        <text x="18" y="109" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#A278E1">Muito Alto (&gt; 80%)</text>
            </g>

            <!-- Botão de Limpar Filtros -->
            <rect x="15" y="650" width="180" height="40" rx="6" fill="#1A1A1A" stroke="#2a2a2a" stroke-width="1"/>


            <!-- Top Header Area (Altura: 60) -->
            <rect x="210" y="0" width="1070" height="60" fill="#121212"/>

            <!-- Título Estilizado -->
            <g filter="url(#shadow)">
                <text x="230" y="38" font-family="Inter, sans-serif" font-size="22" font-weight="600">
                    <tspan fill="#e5e5e5">Previsão de </tspan>
                    <tspan fill="#A278E1">Risco</tspan>
                </text>
                <!-- Linha de detalhe abaixo do título -->
                <rect x="230" y="48" width="40" height="3" rx="1.5" fill="#A278E1"/>
            </g>

            <!-- ==============================
                 KPIs Operacionais (Cards) - Y: 70, H: 90
                 Largura: 255
                 ============================== -->

            <!-- KPI 1: Clientes Selecionados -->
            <rect x="220" y="70" width="255" height="90" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1" filter="url(#shadow)"/>
            <rect x="220" y="70" width="3" height="90" rx="1.5" fill="#A278E1"/>
            <path d="M 220 78 A 8 8 0 0 1 228 70 L 250 70 L 250 160 L 228 160 A 8 8 0 0 1 220 152 Z" fill="#A278E1" opacity="0.04"/>
            <text x="235" y="95" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#666666" letter-spacing="0.5">TOTAL DE CLIENTES</text>
            <g transform="translate(435, 80)" stroke="#444444" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </g>

            <!-- KPI 2: Probabilidade Média -->
            <rect x="485" y="70" width="255" height="90" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1" filter="url(#shadow)"/>
            <rect x="485" y="70" width="3" height="90" rx="1.5" fill="#A278E1"/>
            <path d="M 485 78 A 8 8 0 0 1 493 70 L 515 70 L 515 160 L 493 160 A 8 8 0 0 1 485 152 Z" fill="#A278E1" opacity="0.04"/>
            <text x="500" y="95" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#666666" letter-spacing="0.5">MÉDIA DE RISCO (%)</text>
            <g transform="translate(700, 80)" stroke="#444444" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </g>

            <!-- KPI 3: Valor em Risco ($) -->
            <rect x="750" y="70" width="255" height="90" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1" filter="url(#shadow)"/>
            <rect x="750" y="70" width="3" height="90" rx="1.5" fill="#A278E1"/>
            <path d="M 750 78 A 8 8 0 0 1 758 70 L 780 70 L 780 160 L 758 160 A 8 8 0 0 1 750 152 Z" fill="#A278E1" opacity="0.04"/>
            <text x="765" y="95" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#666666" letter-spacing="0.5">VOLUME TOTAL ($)</text>
            <g transform="translate(965, 80)" stroke="#444444" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/>
                <path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/>
                <path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"/>
            </g>

            <!-- KPI 4: Taxa de Juros Média -->
            <rect x="1015" y="70" width="255" height="90" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1" filter="url(#shadow)"/>
            <rect x="1015" y="70" width="3" height="90" rx="1.5" fill="#A278E1"/>
            <path d="M 1015 78 A 8 8 0 0 1 1023 70 L 1045 70 L 1045 160 L 1023 160 A 8 8 0 0 1 1015 152 Z" fill="#A278E1" opacity="0.04"/>
            <text x="1030" y="95" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#666666" letter-spacing="0.5">TAXA DE JUROS MÉDIA</text>
            <g transform="translate(1230, 80)" stroke="#444444" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="5" x2="5" y2="19"/>
                <circle cx="6.5" cy="6.5" r="2.5"/>
                <circle cx="17.5" cy="17.5" r="2.5"/>
            </g>

            <!-- ==============================
                 LAYOUT DA MESA DE OPERAÇÃO
                 ============================== -->

            <!-- 1. Tabela Principal Gigante (Mesa de Operação) -->
            <!-- x: 220, y: 170, w: 1050 (ocupa toda a largura), h: 540 -->
            <rect x="220" y="170" width="1050" height="540" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1" filter="url(#shadow)"/>
        </svg>